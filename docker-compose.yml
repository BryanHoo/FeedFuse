services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: feedfuse
      POSTGRES_USER: feedfuse
      POSTGRES_PASSWORD: feedfuse
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - feedfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedfuse -d feedfuse']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    command:
      ['sh', '-lc', 'node scripts/db/migrate.mjs && exec node server.js']
    environment:
      DATABASE_URL: postgresql://feedfuse:feedfuse@db:5432/feedfuse
      AUTH_INITIAL_PASSWORD: change-me-before-first-login
      IMAGE_PROXY_SECRET: change-me-before-prod
      FEEDFUSE_MEDIA_DIR: /data/feedfuse/media
      PORT: '9559'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_PORT:-9559}:9559'
    volumes:
      - feedfuse_media:/data/feedfuse/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://$(hostname):9559/api/health" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    command:
      ['sh', '-lc', 'node scripts/db/migrate.mjs && exec node node_modules/tsx/dist/cli.mjs src/worker/index.ts']
    environment:
      DATABASE_URL: postgresql://feedfuse:feedfuse@db:5432/feedfuse
      FEEDFUSE_MEDIA_DIR: /data/feedfuse/media
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - feedfuse_media:/data/feedfuse/media
    restart: unless-stopped

volumes:
  feedfuse_pg:
  feedfuse_media:
