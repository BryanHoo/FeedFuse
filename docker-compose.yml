services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: feedfuse
      POSTGRES_USER: feedfuse
      POSTGRES_PASSWORD: feedfuse
    # 数据库仅供 Compose 网络内的 web 和 worker 访问。
    volumes:
      - feedfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedfuse -d feedfuse']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    command:
      ['sh', '-lc', 'node scripts/db/migrate.mjs && exec node server.js']
    environment:
      DATABASE_URL: postgresql://feedfuse:feedfuse@db:5432/feedfuse
      AUTH_INITIAL_PASSWORD: ${AUTH_INITIAL_PASSWORD}
      IMAGE_PROXY_SECRET: ${IMAGE_PROXY_SECRET}
      RSS_NETWORK_MODE: ${RSS_NETWORK_MODE:-public}
      RSS_ALLOWED_CIDRS: ${RSS_ALLOWED_CIDRS:-}
      PORT: '9559'
      HOSTNAME: '0.0.0.0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_PORT:-9559}:9559'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9559/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  worker:
    # 对齐 Worker 的 60 秒任务等待和 70 秒总退出上限，额外留 5 秒余量。
    stop_grace_period: 75s
    build:
      context: .
      target: worker
    command:
      ['sh', '-lc', 'node scripts/db/migrate.mjs && exec node node_modules/tsx/dist/cli.mjs --tsconfig config/typescript/tsconfig.json src/worker/index.ts']
    environment:
      DATABASE_URL: postgresql://feedfuse:feedfuse@db:5432/feedfuse
      RSS_NETWORK_MODE: ${RSS_NETWORK_MODE:-public}
      RSS_ALLOWED_CIDRS: ${RSS_ALLOWED_CIDRS:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 检查本容器实例的数据库心跳，不能由其他 Worker 的正常状态代替。
      test: ['CMD', 'node', 'node_modules/tsx/dist/cli.mjs', '--tsconfig', 'config/typescript/tsconfig.json', 'src/worker/healthcheck.ts']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  feedfuse_pg:
